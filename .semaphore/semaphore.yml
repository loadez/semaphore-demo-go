version: v1.0
name: ceph-cache-validation
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: "ceph cache round-trip"
    task:
      jobs:
        - name: ceph-cache-test
          commands:
            - checkout
            - 'echo "SEMAPHORE_CACHE_BACKEND=$SEMAPHORE_CACHE_BACKEND"'
            - 'echo "SEMAPHORE_CACHE_S3_URL=$SEMAPHORE_CACHE_S3_URL"'
            - 'echo "SEMAPHORE_CACHE_S3_BUCKET=$SEMAPHORE_CACHE_S3_BUCKET"'
            - 'echo "SEMAPHORE_CACHE_ROLE_ARN=$SEMAPHORE_CACHE_ROLE_ARN"'
            - 'PAYLOAD="ceph-validation-marker-$(date +%s)"; echo "$PAYLOAD" > payload.txt; echo "wrote $PAYLOAD"'
            - cache store ceph-validation-key payload.txt
            - rm -f payload.txt
            - cache restore ceph-validation-key
            - 'echo "RESTORED:"; cat payload.txt'
